[package]
name = "whodunit"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Desktop frontend for whodunit: pi deals a hidden model per role, and you rate the run before the reveal."

[[bin]]
name = "whodunit"
path = "src/main.rs"

[dependencies]
rune = { git = "https://github.com/vaporwavie/rune", rev = "d25fc659ef34905d59f4235f625cc6e6dd7813db" }
rune-kit = { git = "https://github.com/vaporwavie/rune", rev = "d25fc659ef34905d59f4235f625cc6e6dd7813db", features = ["markdown"] }
rune-theme-opencode = { git = "https://github.com/vaporwavie/rune", rev = "d25fc659ef34905d59f4235f625cc6e6dd7813db" }
rune-mac = { git = "https://github.com/vaporwavie/rune", rev = "d25fc659ef34905d59f4235f625cc6e6dd7813db" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "metal", "wgsl"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"

[profile.release]
debug = false
incremental = true

[profile.dev.package."*"]
opt-level = 2
debug = false

[package]
name = "whodunit"
version = "0.1.0"
edition = "2024"
description = "Desktop frontend for whodunit: pi deals a hidden model per role, and you rate the run before the reveal."

[[bin]]
name = "whodunit"
path = "src/main.rs"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "d12581bc66f51068890304ab13e4ce22c355b62a", features = ["native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "d12581bc66f51068890304ab13e4ce22c355b62a", features = ["markdown"] }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "d12581bc66f51068890304ab13e4ce22c355b62a" }
rune-mac = { git = "https://github.com/anomalyco/rune", rev = "d12581bc66f51068890304ab13e4ce22c355b62a" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"

[profile.release]
debug = false
incremental = true

[profile.dev.package."*"]
opt-level = 2
debug = false

# Local rune checkout (branch whodunit) until its changes land upstream.
[patch."https://github.com/anomalyco/rune"]
rune = { path = "../../rune/crates/rune" }
rune-kit = { path = "../../rune/crates/rune-kit" }
rune-theme-opencode = { path = "../../rune/themes/opencode" }
rune-mac = { path = "../../rune/crates/rune-mac" }

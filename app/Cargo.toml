[package]
name = "whodunit"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Desktop frontend for whodunit: pi deals a hidden model per role, and you rate the run before the reveal."

[[bin]]
name = "whodunit"
path = "src/main.rs"

[dependencies]
rune = { git = "https://github.com/vaporwavie/rune", rev = "b252ba439fc8f884c0e10ba0b95aab075cdec7b8" }
rune-kit = { git = "https://github.com/vaporwavie/rune", rev = "b252ba439fc8f884c0e10ba0b95aab075cdec7b8", features = ["markdown"] }
rune-theme-opencode = { git = "https://github.com/vaporwavie/rune", rev = "b252ba439fc8f884c0e10ba0b95aab075cdec7b8" }
rune-mac = { git = "https://github.com/vaporwavie/rune", rev = "b252ba439fc8f884c0e10ba0b95aab075cdec7b8" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"

[profile.release]
debug = false
incremental = true

[profile.dev.package."*"]
opt-level = 2
debug = false
